<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ar--head" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#fafafa"/>
  <text x="24" y="36" font-size="20" font-weight="bold" fill="#222">Contestation system: automated / manual + sovereignty</text>
  <text x="24" y="58" font-size="13" fill="#555">green = transportable (you own it / can move it)&#160;&#160;&#160;red = inbuilt dependency (vendor or licence)&#160;&#160;&#160;blue = your pipeline&#160;&#160;&#160;grey = planned</text>

  <!-- column labels -->
  <text x="24" y="92" font-size="12" font-weight="bold" fill="#888">SOURCES</text>
  <text x="360" y="92" font-size="12" font-weight="bold" fill="#888">PIPELINE (TypeScript, any Node)</text>
  <text x="710" y="92" font-size="12" font-weight="bold" fill="#888">STORE &amp; CONSUMERS</text>

  <!-- arrows (drawn first, under boxes) -->
  <g stroke="#555" stroke-width="1.6" marker-end="url(#ar--head)" fill="none">
    <path d="M250,135 L355,250"/>
    <path d="M250,205 L355,255"/>
    <path d="M250,275 L355,262"/>
    <path d="M250,345 L355,270"/>
    <path d="M250,415 L355,285"/>
    <path d="M505,140 L505,205"/>
    <path d="M505,360 L505,320"/>
    <path d="M660,260 L700,255"/>
    <path d="M835,300 L835,300"/>
    <path d="M835,275 L835,300"/>
    <path d="M835,360 L835,385"/>
  </g>

  <!-- sources -->
  <g>
    <rect x="20" y="110" width="230" height="55" rx="6" fill="#e3f1e3" stroke="#27ae60" stroke-width="1.6"/>
    <text x="135" y="133" text-anchor="middle" font-weight="bold">GDELT</text>
    <text x="135" y="151" text-anchor="middle" font-size="12" fill="#555">open news index &#183; [auto]</text>

    <rect x="20" y="180" width="230" height="55" rx="6" fill="#e3f1e3" stroke="#27ae60" stroke-width="1.6"/>
    <text x="135" y="203" text-anchor="middle" font-weight="bold">RSS on named sites</text>
    <text x="135" y="221" text-anchor="middle" font-size="12" fill="#555">[auto] &#183; planned</text>

    <rect x="20" y="250" width="230" height="55" rx="6" fill="#e3f1e3" stroke="#27ae60" stroke-width="1.6"/>
    <text x="135" y="273" text-anchor="middle" font-weight="bold">Planning portals</text>
    <text x="135" y="291" text-anchor="middle" font-size="12" fill="#555">submissions &#183; [semi] &#183; planned</text>

    <rect x="20" y="320" width="230" height="55" rx="6" fill="#fce4e4" stroke="#c0392b" stroke-width="1.6"/>
    <text x="135" y="343" text-anchor="middle" font-weight="bold">Factiva via RMIT</text>
    <text x="135" y="361" text-anchor="middle" font-size="12" fill="#555">licensed &#183; [MANUAL]</text>

    <rect x="20" y="390" width="230" height="55" rx="6" fill="#e3f1e3" stroke="#27ae60" stroke-width="1.6"/>
    <text x="135" y="413" text-anchor="middle" font-weight="bold">Council / town halls</text>
    <text x="135" y="431" text-anchor="middle" font-size="12" fill="#555">[MANUAL] deep-dive</text>
  </g>

  <!-- pipeline -->
  <rect x="360" y="95" width="290" height="45" rx="6" fill="#fce4e4" stroke="#c0392b" stroke-width="1.6"/>
  <text x="505" y="122" text-anchor="middle">GitHub Actions cron &#183; [auto]</text>

  <rect x="360" y="200" width="290" height="120" rx="8" fill="#dfe7ff" stroke="#3a5bd0" stroke-width="2"/>
  <text x="505" y="232" text-anchor="middle" font-weight="bold" font-size="15">PIPELINE</text>
  <text x="505" y="256" text-anchor="middle" font-size="13">retrieve &#8594; classify &#8594; resolve &#8594; write</text>
  <text x="505" y="280" text-anchor="middle" font-size="12" fill="#3a5bd0">controlled vocabulary + site resolver</text>
  <text x="505" y="300" text-anchor="middle" font-size="12" fill="#555">(transportable)</text>

  <rect x="360" y="360" width="290" height="55" rx="6" fill="#fce4e4" stroke="#c0392b" stroke-width="1.6"/>
  <text x="505" y="383" text-anchor="middle" font-weight="bold">Anthropic API</text>
  <text x="505" y="401" text-anchor="middle" font-size="12" fill="#555">the classifier intelligence</text>

  <!-- store + consumers -->
  <rect x="700" y="200" width="270" height="80" rx="6" fill="#fce4e4" stroke="#c0392b" stroke-width="1.6"/>
  <text x="835" y="230" text-anchor="middle" font-weight="bold">Notion</text>
  <text x="835" y="249" text-anchor="middle" font-size="12" fill="#555">Infra + Contestation trackers</text>
  <text x="835" y="267" text-anchor="middle" font-size="12" fill="#555">data is exportable</text>

  <rect x="700" y="300" width="270" height="55" rx="6" fill="#fce4e4" stroke="#c0392b" stroke-width="1.6"/>
  <text x="835" y="323" text-anchor="middle" font-weight="bold">Map app</text>
  <text x="835" y="341" text-anchor="middle" font-size="12" fill="#555">Cloudflare + Mapbox</text>

  <rect x="700" y="385" width="270" height="50" rx="6" fill="#eeeeee" stroke="#888888" stroke-width="1.6"/>
  <text x="835" y="408" text-anchor="middle" font-weight="bold">/sovereignties page</text>
  <text x="835" y="425" text-anchor="middle" font-size="12" fill="#555">planned</text>

  <!-- footnote -->
  <text x="24" y="500" font-size="13" fill="#444">The substance (code, vocabulary, resolver, open sources, your data) is transportable.</text>
  <text x="24" y="520" font-size="13" fill="#444">The dependencies are the model (Anthropic), the store (Notion), hosting (Cloudflare/Mapbox), and one licensed source (Factiva).</text>
  <text x="24" y="540" font-size="13" fill="#444">No dependency traps your data; the lock-in is in tooling and the model, which is the tension the project studies.</text>
</svg>
