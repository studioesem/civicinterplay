<text x="24" y="716" font-size="12.5" fill="#4a4541">Nothing an agent proposes reaches the map, the data sheets or the Trends page until a person has reviewed it.</text>
<text x="24" y="735" font-size="12.5" fill="#4a4541">News feed items are classified by an agent and published directly, marked when the agent’s confidence is low.</text>
<text x="24" y="754" font-size="12.5" fill="#4a4541">Platform dependencies are listed with the methodology.</text>
