<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="783" viewBox="0 0 1160 783" font-family="'Fira Sans', system-ui, Helvetica, Arial, sans-serif" role="img" aria-labelledby="ttw-t ttw-d">
<title id="ttw-t">How the Data Tracker works</title>
<desc id="ttw-d">Sources feed an automated scan. Agents can only propose new entries; a person reviews each before it reaches the map, sheets or Trends. News items are classified by an agent and go to the record without review. People verify rows against sources; skeptic agents test findings and a person judges them. The record is frozen as snapshots and published as a map, sheets, trends, a news feed and an open repository.</desc>
