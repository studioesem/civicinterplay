<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <rect width="1080" height="1350" fill="#111111"/>

  <g stroke="#F4ECD7" stroke-width="3" opacity="0.45">
       <line x1="34" y1="190" x2="62" y2="190"/>
       <line x1="48" y1="176" x2="48" y2="204"/>
     </g>
  <g stroke="#F4ECD7" stroke-width="3" opacity="0.45">
       <line x1="1018" y1="190" x2="1046" y2="190"/>
       <line x1="1032" y1="176" x2="1032" y2="204"/>
     </g>
  <g stroke="#F4ECD7" stroke-width="3" opacity="0.45">
       <line x1="34" y1="1260" x2="62" y2="1260"/>
       <line x1="48" y1="1246" x2="48" y2="1274"/>
     </g>
  <g stroke="#F4ECD7" stroke-width="3" opacity="0.45">
       <line x1="1018" y1="1260" x2="1046" y2="1260"/>
       <line x1="1032" y1="1246" x2="1032" y2="1274"/>
     </g>

  <!-- Eyebrow bar, inverted: cream bar, black text -->
  <rect x="90" y="90" width="760" height="58" fill="#F4ECD7"/>
  <rect x="112" y="113" width="13" height="13" fill="#111111"/>
  <text x="140" y="129"
        font-family="Menlo, Consolas, monospace"
        font-size="23" font-weight="500" letter-spacing="4.2"
        fill="#111111">FIELD NOTES FROM HISTORY IN THE MAKING</text>

  <!-- Asterisk -->
  <text x="110" y="380"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="96" font-weight="700" fill="#F4ECD7">*</text>

  <!-- Magenta rule -->
  <rect x="110" y="440" width="112" height="13" fill="#B8317B"/>

  <!-- Headline -->
  <text x="108" y="600"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="86" font-weight="700" letter-spacing="-1"
        fill="#F4ECD7">Run this</text>

  <rect x="98" y="628" width="640" height="106" fill="#F4ECD7"/>
  <text x="116" y="712"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="86" font-weight="700" letter-spacing="-1"
        fill="#111111">where you live</text>

  <!-- Sub-line -->
  <text x="108" y="812"
        font-family="Menlo, Consolas, monospace"
        font-size="27" letter-spacing="0.5"
        fill="#9a9186">map the AI infrastructure</text>
  <text x="108" y="852"
        font-family="Menlo, Consolas, monospace"
        font-size="27" letter-spacing="0.5"
        fill="#9a9186">in your own jurisdiction</text>

  <!-- Sign-off -->
  <rect x="98" y="1120" width="384" height="82" fill="#F4ECD7"/>
  <text x="116" y="1177"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="54" font-weight="700" letter-spacing="-0.5"
        fill="#111111">/start/</text>

  <text x="108" y="1258"
        font-family="Menlo, Consolas, monospace"
        font-size="22" letter-spacing="2.6"
        fill="#7d766c">CIVIC INTERPLAY &#183; THE METHOD, NOT THE MAP</text>
</svg>