media:
  input: public/images
  output: /images

content:
  - name: home
    label: Home page
    type: file
    path: src/data/home.json
    format: json
    fields:
      - name: hotspots
        label: Hero hotspots
        type: object
        list: true
        description: The provocations that pop up over the header illustration. Positions are a percentage across and down the header box, so 50 / 50 is dead centre. Keep them above about 55 down, or they collide with the title.
        fields:
          - name: label
            label: Question
            type: string
            required: true
            description: Keep it short. It shows on one line.
          - name: x
            label: Across (%)
            type: number
            required: true
          - name: y
            label: Down (%)
            type: number
            required: true
      - name: tiles
        label: Tiles
        type: object
        list: true
        fields:
          - name: id
            label: Image id
            type: string
            required: true
            description: Matches the file in public/images/tiles, e.g. "stack" uses stack-560.webp. Run `npm run tiles:build` to add a new one.
          - name: type
            label: Card type
            type: select
            default: field-note
            description: Drives the card's colour and marker. Tool is cream with a pulsing dot, field note is periwinkle with a square, method is purple with an arrow.
            options:
              values:
                - value: tool
                  label: Live tool
                - value: field-note
                  label: Field note
                - value: method
                  label: Method
          - name: kicker
            label: Kicker
            type: string
            description: Small label above the call to action, e.g. Live tool, Field note, Method
          - name: cta
            label: Call to action
            type: string
            required: true
            description: The clickable line. Keep it a verb phrase, plain language, no jargon.
          - name: href
            label: Link
            type: string
            required: true
          - name: alt
            label: Image alt text
            type: text
            required: true
            description: Transcribe what the card says. This is the only text a screen reader gets for the image.
          - name: draft
            label: Hidden
            type: boolean
            default: false
            description: Hide the tile until its destination page exists

  - name: fieldnotes
    label: Field notes
    type: collection
    path: src/content/fieldnotes
    extension: mdx
    format: yaml-frontmatter
    filename: "{fields.tileId}.mdx"
    view:
      fields: [title, publishedAt, draft]
      default:
        sort: publishedAt
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
        description: Used for search results and link previews
      - name: eyebrow
        label: Eyebrow
        type: string
        default: Civic Interplay / Field note
      - name: heading
        label: Page heading
        type: string
        required: true
        description: The question the page answers, in plain language
      - name: standfirst
        label: Standfirst
        type: text
        required: true
      - name: tileId
        label: Image id
        type: string
        required: true
        description: Matches public/images/tiles, e.g. "ladder". Also becomes the URL.
      - name: imageAlt
        label: Image alt text
        type: text
        required: true
      - name: caption
        label: Image caption
        type: string
      - name: tagHeading
        label: Column heading
        type: string
        description: Heading above the right-hand column, e.g. "Who holds it" or "Drawn from"
      - name: layers
        label: Layers / rungs
        type: object
        list: true
        description: The diagram as text. Top of the diagram first.
        fields:
          - name: num
            label: Number
            type: string
            required: true
          - name: name
            label: Name
            type: string
            required: true
          - name: detail
            label: Detail
            type: text
          - name: tag
            label: Tag
            type: string
            description: Who holds it, or what it is drawn from
          - name: tagNote
            label: Tag note
            type: string
            description: The source, agency, or field
          - name: verify
            label: Adjacent precedent
            type: boolean
            default: false
            description: Flags this as a close analogue rather than a direct one
          - name: highlight
            label: Highlight
            type: boolean
            default: false
      - name: next
        label: Where to next
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: href
            label: Link
            type: string
            required: true
          - name: external
            label: Opens in a new tab
            type: boolean
            default: false
      - name: doi
        label: DOI
        type: string
        description: Without the https://doi.org/ prefix. Drives the "Cite this" block.
      - name: publishedAt
        label: Published at
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm:ss.SSSxxx
      - name: updatedAt
        label: Updated at
        type: date
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm:ss.SSSxxx
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: body
        label: Body
        type: rich-text
        description: Prose only. Use a blockquote for a caveat, it renders as the pink note panel.

  - name: claimcards
    label: Claim cards
    type: collection
    path: src/content/claimcards
    extension: json
    format: json
    filename: "{fields.set}.json"
    view:
      fields: [title, set, draft]
      default:
        sort: set
        order: desc
    fields:
      - name: set
        label: Tracking night
        type: string
        required: true
        description: The night the documents were read, as 2026-09-19. Not the night a post goes out, and not the date on the source. Becomes the filename and the web address.
      - name: title
        label: Title
        type: string
        required: true
        description: How the set is named on the page, e.g. 19 September 2026.
      - name: standfirst
        label: Standfirst
        type: text
        description: Not shown on the page. Kept as a note to yourself about what the night was.
      - name: readOn
        label: Date read
        type: string
        description: Same as the tracking night, as 2026-09-19. Drives the date shown on the page, weekday and all.
      - name: readAt
        label: Time of the sitting
        type: string
        description: 'In plain words, e.g. 10pm to 11pm. Optional, and better left out than guessed at. Only put a time here if you know it.'
      - name: runningOrder
        label: Running order
        type: text
        description: A working note to yourself about how the set plays if posted together. Written in card numbers, and the numbers are not printed, so it is not shown on the page or on a card.
      - name: draft
        label: Draft
        type: boolean
        default: true
        description: Keep this ON while you are working. Drafts can be read locally and never reach the live site.
      - name: cards
        label: Cards
        type: object
        list: true
        fields:
          - name: id
            label: Number
            type: string
            required: true
            description: Two digits, as 01. Becomes the card's filename, so do not renumber a card once it has been posted.
          - name: kind
            label: Label
            type: select
            default: CLAIM
            description: Printed in the black bar at the top of the card.
            options:
              values: [CLAIM, ARCHIVE]
          - name: title
            label: Working title
            type: string
            description: For finding the card again. Never printed on it.
          - name: claim
            label: The claim
            type: text
            required: true
            description: "One sentence. Put [[double square brackets]] around the words that get the black highlight, e.g. totalling [[20 gigawatts]]. You can highlight more than one phrase."
          - name: source
            label: Attribution line 1
            type: string
            required: true
            description: The document. Set in capitals, e.g. TRANSGRID · 2026 TRANSMISSION ANNUAL PLANNING REPORT
          - name: meta
            label: Attribution line 2
            type: string
            description: Where in it, and when you read it, e.g. PAGE 20 · READ 19·09·2026
          - name: status
            label: Status
            type: select
            required: true
            description: The ceiling, not the average. A claim that is sourced for its figure and unverified for its comparison sits at unverified.
            options:
              values:
                - value: VERIFIED
                  label: VERIFIED, walked to the primary document by a person
                - value: SOURCED
                  label: SOURCED, quoted correctly, nobody has independently checked it
                - value: UNVERIFIED
                  label: UNVERIFIED, rests on this project's own computation
          - name: ground
            label: Ground
            type: select
            default: cream
            description: Cream or inverted. Seventeen cards on one ground read as wallpaper, so flip roughly one in three. Try not to put two inverted cards next to each other in the list.
            options:
              values:
                - value: cream
                  label: Cream, black type
                - value: ink
                  label: Black, cream type
          - name: highlight
            label: Highlight colour
            type: select
            default: default
            description: The colour behind the [[bracketed]] words. Default is the ground inverted, so black on a cream card and cream on a black one. Magenta is the Field Notes accent. A coloured highlight always carries cream text.
            options:
              values:
                - value: default
                  label: Default, the ground inverted
                - value: magenta
                  label: Magenta
                - value: purple
                  label: Purple
          - name: note
            label: Note if used
            type: text
            description: The caveat that must travel with this claim. Shown on the page, never printed on the card, because small type on a card is not a caveat.
          - name: hold
            label: Hold this card
            type: boolean
            default: false
            description: Keeps the card out of the image export until the caveat can travel with it. Turn this on for anything that needs a question asked before it goes out.
          - name: image
            label: Artwork
            type: string
            description: For an ARCHIVE card. A path inside the sibling project folders, e.g. ai-sovereignties/docs/figures/name.png. Leave blank and the card is set as type.
          - name: imageCrop
            label: Artwork crop
            type: string
            description: "Optional, as left,top,width,height in the source image's own pixels. Use it to trim an interface out of a screen capture. Leave blank to crop from the centre."
          - name: imageAlt
            label: Artwork alt text
            type: text
            description: Describe what the photograph shows. This is the only text a screen reader gets for it.

  - name: posts
    label: Posts
    type: collection
    path: src/content/posts
    extension: mdx
    format: yaml-frontmatter
    filename: "{fields.slug}.mdx"
    view:
      fields: [title, primaryCategory, publishedAt, draft]
      sort: [publishedAt, title]
      default:
        sort: publishedAt
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        description: URL path for the post, e.g. what-is-civic-interplay
      - name: subtitle
        label: Subtitle
        type: string
      - name: excerpt
        label: Excerpt
        type: text
      - name: publishedAt
        label: Published at
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm:ss.SSSxxx
      - name: updatedAt
        label: Updated at
        type: date
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm:ss.SSSxxx
      - name: featureImage
        label: Feature image
        type: image
      - name: featureImageAlt
        label: Feature image alt text
        type: string
      - name: featureVideo
        label: Feature video (mp4 URL)
        type: string
      - name: featureVideoWebm
        label: Feature video (webm URL)
        type: string
      - name: featureAudio
        label: Feature audio (mp3 URL)
        type: string
      - name: featureAudioOgg
        label: Feature audio (ogg URL)
        type: string
      - name: categories
        label: Categories
        type: select
        list: true
        options:
          values:
            - value: foundational-docs
              label: Foundational Docs
            - value: training-grounds
              label: Training Grounds
            - value: essays-readings
              label: Essays & Readings
            - value: the-portals
              label: The Portals
      - name: primaryCategory
        label: Primary category
        type: select
        options:
          values:
            - value: foundational-docs
              label: Foundational Docs
            - value: training-grounds
              label: Training Grounds
            - value: essays-readings
              label: Essays & Readings
            - value: the-portals
              label: The Portals
      - name: author
        label: Author
        type: string
        default: Sarah Barns
      - name: featured
        label: Featured
        type: boolean
        default: false
      - name: accent
        label: Card colour
        type: select
        description: Leave blank to use the category colour. Set it when a card should read as what it is rather than where it sits, e.g. cream for a tool.
        options:
          values:
            - value: cream
              label: Cream (tools)
            - value: purple
              label: Purple
            - value: terracotta
              label: Terracotta
            - value: periwinkle
              label: Periwinkle
            - value: pink
              label: Pink
            - value: plain
              label: Plain white
      - name: draft
        label: Draft
        type: boolean
        default: false
        description: Drafts build locally but are excluded from the live site
      - name: articleType
        label: Article type
        type: select
        default: BlogPosting
        options:
          values: [BlogPosting, Article, ScholarlyArticle, CreativeWork]
      - name: keywords
        label: Keywords
        type: string
        list: true
      - name: body
        label: Body
        type: rich-text

  - name: embeds
    label: Embeds
    type: collection
    path: src/content/embeds
    extension: json
    format: json
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: mediaType
        label: Media type
        type: select
        default: video
        options:
          values: [video, audio]
      - name: video
        label: Video (mp4 URL)
        type: string
      - name: videoWebm
        label: Video (webm URL)
        type: string
      - name: aspectRatio
        label: Aspect ratio
        type: string
        description: e.g. 16/9 or auto
      - name: audio
        label: Audio (mp3 URL)
        type: string
      - name: audioOgg
        label: Audio (ogg URL)
        type: string
      - name: poster
        label: Poster image URL
        type: string
      - name: caption
        label: Caption
        type: string
      - name: credit
        label: Credit
        type: string
      - name: sourcePostSlug
        label: Source post slug
        type: string
